<style>
body{margin:0;padding:8px 10px max(10px,env(safe-area-inset-bottom))}
.r{display:flex;align-items:center;gap:8px}
.s{justify-content:space-between}
h3{margin:0;font-size:1.1em;flex:1;line-height:1.2}
p{margin:4px 0}
.h{color:var(--tg-theme-hint-color);font-size:.84em}
.it{margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--tg-theme-secondary-bg-color)}
.n{flex:1;max-height:2.6em;overflow:hidden;line-height:1.3}
.pr{font-weight:700;white-space:nowrap}
.o{display:block;text-decoration:line-through;color:var(--tg-theme-hint-color);font-size:.78em;text-align:right}
.tg{margin-left:4px;padding:1px 6px;border-radius:8px;background:#e0312b;color:#fff;font-size:.72em;font-weight:700}
.g{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}
.g button{min-height:46px;border-radius:12px;font-weight:600}
.a{background:var(--tg-theme-secondary-bg-color);color:var(--tg-theme-text-color)}
.m{margin:8px 0 0;padding:7px 9px;border-radius:10px;background:var(--tg-theme-secondary-bg-color);font-size:.88em}
.x{color:var(--tg-theme-destructive-text-color)}
.ok{color:#2e9e4f}
.q{min-width:1.8em;text-align:center;font-weight:700}
.sm{padding:4px 10px;min-width:36px}
img{width:96px;height:96px;object-fit:contain;border-radius:10px;background:#fff}
.w{width:100%;margin-top:8px}
.t{margin-top:8px;padding-top:8px;border-top:1px solid var(--tg-theme-section-separator-color);font-size:1.05em}
</style><div id="r"></div><script>
const W=window.TelegramWidget,R=document.getElementById('r'),L=__L__;
let S=__D__,busy=0,note='';
function P(x){try{return JSON.parse(x)}catch(e){return null}}
function E(t,c,x){const n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function M(v){return Number(v||0).toLocaleString('ru-RU').replace(/ |,/g,' ')+' '+L.sum}
function B(t,q,c){const b=E('button',c,t);b.disabled=!!busy;b.onclick=()=>go(q);return b}
function go(q){if(busy||!W)return;busy=1;note=L.wait;W.request(q).then(a=>{busy=0;note='';const s=P(a.result);if(s)S=s;draw()},e=>{busy=0;note=L[e.code]||L.err;draw()});draw()}
function head(t,back){const h=E('div','r s');if(back)h.append(B('‹',back,'a sm'));h.append(E('h3','',t));h.append(B('🧺 '+(S.n||0),'k','a sm'));R.append(h)}
function price(p,o){const s=E('span','pr',M(p));if(o){s.append(E('span','tg','−'+Math.round(100-p*100/o)+'%'));s.append(E('span','o',M(o)))}return s}
function step(id,q){const r=E('div','r');r.append(B('−','d:'+id,'a sm'),E('span','q',q),B('+','a:'+id,'a sm'));return r}
function foot(){const g=E('div','g');g.append(B('🧺 '+L.cart,'k','a'),B('📦 '+L.orders,'r','a'));R.append(g)}
const V={
h(){head(L.cat);const g=E('div','g');for(const[i,t]of S.c||[])g.append(B(t,'c:'+i+':0','a'));R.append(g);R.append(E('p','h',L.find));foot()},
l(){head(S.t,'h');for(const[i,t,p,o,ok,q]of S.i||[]){const r=E('div','r it');const n=E('div','n',t);n.onclick=()=>go('p:'+i);r.append(n);if(ok){r.append(price(p,o));r.append(q?step(i,q):B('+','a:'+i,'sm'))}else r.append(E('span','h x',L.out));R.append(r)}
if(!(S.i||[]).length)R.append(E('p','h',L.none));else R.append(E('p','h',L.tap));const g=E('div','r s');if(S.pg>0)g.append(B('‹ '+L.prev,S.b+':'+(S.pg-1),'a'));if(S.mo)g.append(B(L.next+' ›',S.b+':'+(S.pg+1),'a'));if(g.childNodes.length)R.append(g)},
p(){head(L.item,S.b||'h');const r=E('div','r');if(S.im){const i=E('img');i.src=S.im;r.append(i)}const c=E('div');c.append(E('p','',S.t));if(S.br)c.append(E('p','h',S.br));c.append(price(S.pr,S.o));r.append(c);R.append(r);if(S.d)R.append(E('p','h',S.d));
if(!S.ok)R.append(E('p','x',L.out));else if(S.q)R.append(step(S.id,S.q));else R.append(B('🛒 '+L.add,'a:'+S.id,'w'));if(S.u){const b=E('button','a w',L.site);b.onclick=()=>W.openLink(S.u);R.append(b)}},
k(){head(L.cart,'h');for(const[i,t,q,s]of S.i||[]){const r=E('div','r it');r.append(E('div','n',t),step(i,q),E('span','pr',M(s)));R.append(r)}
if(!(S.i||[]).length){R.append(E('p','h',L.empty));R.append(B('🛍 '+L.cat,'h','a w'));return}if(S.mr)R.append(E('p','h','+'+S.mr));const t=E('div','r s t');t.append(E('b','',L.total),E('b','',M(S.s)));R.append(t);R.append(B('✅ '+L.order,'o','w'))},
o(){head(L.how,'k');for(const[c,t,f,mn]of S.dl||[]){const b=B(t+' · '+(f?M(f):L.free),'t:'+c,'a w');if(mn)b.append(E('div','h',L.min+' '+M(mn)));R.append(b)}},
w(){head(L.how,'k');R.append(E('p','m',S.tx||''))},
r(){head(L.orders,'h');for(const[c,t,s,k]of S.i||[]){const r=E('div','r it');const n=E('div','n');n.append(E('b','','№ '+c));n.append(E('div','h '+(k||''),t));r.append(n,E('span','pr',M(s)));R.append(r)}if(!(S.i||[]).length&&!S.m)R.append(E('p','h',L.none))}};
function draw(){R.textContent='';if(!S)return;(V[S.v]||V.h)();const t=note||S.m;if(t)R.append(E('p','m',t))}
if(W){const s=P(W.chatData);if(s)S=s;W.onEvent('chatDataChanged',()=>{const s=P(W.chatData);if(s&&!busy){S=s;draw()}})}
draw();
</script>
